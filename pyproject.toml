[project]
name = "lossproof"
version = "0.1.0"
description = "A CDC lakehouse on emulated AWS that proves it lost nothing."
readme = "README.md"
authors = [
    { name = "RahimMahat", email = "rahimmahat99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "awslambdaric>=4.2.0",
    "boto3>=1.40",
    "confluent-kafka>=2.16.0",
    "dbt-duckdb[glue]>=1.11.0",
    "psycopg[binary]>=3.2",
    "pyiceberg[glue,pyarrow]>=0.12.0",
    "typer>=0.27.3",
]

[project.scripts]
lossproof = "lossproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "mypy>=2.4.0",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "streamlit>=1.65.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
