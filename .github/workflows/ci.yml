name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # Unit tests are pure functions: no Docker and no emulator needed.
      - run: uv run pytest -q

  # The whole platform on the runner: Floci, Terraform, Debezium, both consumers, one fault scenario.
  # The chaos command exits 1 if the correct consumer's tables differ from the source.
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # the wrapper breaks `terraform output -raw` in scripts/up.sh
      - run: uv sync --locked
      - run: bash scripts/up.sh
      # The main stream: some load, then the nightly workflow (compact, reconcile, build and test marts).
      - run: docker compose run --rm -T app source generate --n 5000 && sleep 45
      - run: uv run python scripts/run_workflow.py
      # A scenario takes over the platform, so it runs last.
      - run: uv run lossproof chaos crash --n 5000
      - if: failure()
        run: docker ps -a && docker compose logs --tail 100
